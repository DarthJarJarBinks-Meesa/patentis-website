services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: patentis
      POSTGRES_PASSWORD: patentis
      POSTGRES_DB: patentis
    ports:
      - "5433:5432"
    volumes:
      - patentis_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patentis -d patentis"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://patentis:patentis@postgres:5432/patentis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "workers.scheduler", "all"]

volumes:
  patentis_pg:

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patentis-platform"
version = "0.1.0"
description = "Patentis innovation intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pgvector>=0.3.6",
  "httpx>=0.28.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.18",
  "numpy>=2.0.0",
  "scikit-learn>=1.5.0",
  "rank-bm25>=0.2.2",
  "pypdf>=5.1.0",
  "redis>=5.2.0",
]

[project.optional-dependencies]
full = [
  "sentence-transformers>=3.3.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["patentis_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
